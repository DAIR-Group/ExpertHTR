[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experthtr"
version = "0.1.0"
description = "Reproducibility artifact for sparse MoE full-input handwritten text recognition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Dang Hoai Nam"},
    {name = "Nguyen Duy Hieu"},
    {name = "Vo Nguyen Le Duy"},
]
keywords = ["handwritten-text-recognition", "htr", "mixture-of-experts", "multitask-learning"]
dependencies = ["PyYAML>=5.4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["nbformat>=5.0", "PyYAML>=5.4"]

[project.scripts]
experthtr = "expert.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["expert*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"expert/**" = ["E501"]  # audited research expressions retain readable line-level diagnostics
