name: Release contract

on:
  push:
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install release-check dependencies
        run: python -m pip install --upgrade pip PyYAML nbformat
      - name: Validate frozen configuration
        run: python scripts/check_release.py
      - name: Validate Python package contract
        run: python scripts/check_python_contract.py
      - name: Install the package exactly as a user would
        run: python -m pip install --no-deps -e .
      - name: Run public orchestration regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate optional demo notebook hygiene
        run: python scripts/check_demo_notebook.py
